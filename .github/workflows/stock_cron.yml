name: Morning Stock Screening

on:
  schedule:
    # 日本時間の平日の朝8:30に実行（UTC 23:30 / 月〜金）
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # 手動でも動かせるようにする設定

jobs:
  run-screening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy yfinance lightgbm scikit-learn

      - name: Run screening script
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python line_auto_notify.py