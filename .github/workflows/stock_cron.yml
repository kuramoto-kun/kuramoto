name: Stock Screening and Forward Test

on:
  schedule:
    # 日本時間の平日の朝8:30に実行（UTC 23:30 / 月〜金）
    # ※もし月・水・金曜日にしたい場合は '30 23 * * 1,3,5' に調整してください
    - cron: '30 23 * * 1-5'
  workflow_dispatch: # 手動でも動かせるようにする設定

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    # GitHub Actionsにリポジトリの書き込み権限を与える設定（超重要！）
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance lightgbm scikit-learn

      - name: Run line_auto_notify script
        run: |
          python line_auto_notify.py
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

      # CSVファイルを自動でGitHubに保存するステップ（超重要！）
      - name: Commit and push forward test log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.users.github.com"
          
          # 変更があったか確認し、あればコミットする
          git add forward_test_log.csv
          git diff --cached --quiet || git commit -m "Auto-update forward test log [skip ci]"
          
          # リポジトリにプッシュ
          git push